[package]
name = "knowhow-computer-core"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Cross-platform computer-use core (mouse/keyboard/screen) for @tyvm/knowhow, built with napi-rs. Owned engine, no third-party input library."

[lib]
crate-type = ["cdylib"]

[dependencies]
# napi bindings. Keep the feature set narrow; async is used for capture.
napi = { version = "2", default-features = false, features = ["napi4", "async"] }
napi-derive = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# PNG decoding for screencapture output (CGDisplayCreateImage is broken on macOS 26+).
image = { version = "0.25", default-features = false, features = ["png"] }
core-graphics = { version = "0.23", features = ["highsierra"] }
core-foundation = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.56", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# X11 backend (Wayland backend added in a later phase).
x11rb = { version = "0.13", features = ["xtest"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
