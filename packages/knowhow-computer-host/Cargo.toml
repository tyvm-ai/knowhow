[package]
name = "knowhow-computer-host"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Resident host for knowhow computer-use automations: kill switch, global hotkeys, worker supervisor, IPC and tray."

[[bin]]
name = "knowhow-computer-host"
path = "src/main.rs"

[lib]
name = "knowhow_computer_host"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "process", "time", "macros", "fs", "signal"] }
log = "0.4"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tao = "0.37"
tray-icon = "0.26"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Same versions as ../knowhow-computer-core/Cargo.toml
core-graphics = { version = "0.23", features = ["highsierra"] }
core-foundation = "0.9"
# Same versions tao 0.37 pulls in (see Cargo.lock) so there is a single objc2.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.56", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_Graphics_Gdi",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
strip = "symbols"
