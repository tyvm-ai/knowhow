<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Click Grid Precision</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d18;color:#eef;font-family:Arial,sans-serif;user-select:none}.hud{position:fixed;z-index:2;top:0;left:0;right:0;height:78px;background:rgba(4,8,18,.96);border-bottom:1px solid #506080;display:flex;align-items:center;justify-content:center;gap:34px}.label{font-size:11px;color:#9aabc8;text-transform:uppercase;letter-spacing:1px}.value{font-size:22px;font-weight:bold;color:#fff}.request{font-size:38px;color:#ffc457;min-width:70px;text-align:center}.finish{position:fixed;z-index:3;inset:0;display:none;place-items:center;background:rgba(4,8,18,.95);text-align:center}.finish h1{color:#7dffb2}.finish pre{font:16px monospace;color:#d8e4ff}.hint{position:fixed;z-index:2;bottom:10px;left:0;right:0;text-align:center;color:#8392ad;font-size:12px}</style></head><body><canvas id="canvas"></canvas><div class="hud"><div><div class="label">Please click number</div><div class="request" id="request">—</div></div><div><div class="label">Progress</div><div class="value" id="progress">0 / 10</div></div><div><div class="label">Hits / misses</div><div class="value" id="counts">0 / 0</div></div><div><div class="label">Session</div><div class="value" id="session">—</div></div></div><div class="hint">Find the numbered circle shown above and click it. Complete all 10 rounds.</div><div class="finish" id="finish"><div><h1>Complete</h1><pre id="summary"></pre></div></div><script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let state=null,session=null,shownAt=0,busy=false,movement=[],lastMoveAt=null;
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);draw();} addEventListener('resize',resize); canvas.addEventListener('pointermove',e=>{lastMoveAt=performance.now();movement.push({x:e.clientX,y:e.clientY,t:lastMoveAt-shownAt});if(movement.length>250)movement.shift();});
function draw(){if(!state?.geometry)return;const size=state.geometry.nodeSize||25,radius=size/2,fontSize=Math.max(9,Math.round(size*.38));ctx.clearRect(0,0,innerWidth,innerHeight);for(const n of state.geometry.nodes){ctx.beginPath();ctx.arc(n.x,n.y,radius,0,Math.PI*2);ctx.fillStyle='#29649a';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#75bdf2';ctx.stroke();ctx.fillStyle='#fff';ctx.font=`bold ${fontSize}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n.number,n.x,n.y);}}
function render(s){state=s;document.getElementById('request').textContent=s.requestedNumber??'—';document.getElementById('progress').textContent=`${s.round} / ${s.totalRounds}`;document.getElementById('counts').textContent=`${s.hits} / ${s.misses}`;document.getElementById('session').textContent=s.sessionId.slice(0,8);draw();shownAt=performance.now();lastMoveAt=null;movement=[];if(s.finished){document.getElementById('finish').style.display='grid';document.getElementById('summary').textContent=JSON.stringify({complete:s.complete,score:s.score,accuracy:s.accuracy,meanTargetLatencyMs:s.meanTargetLatencyMs,p95TargetLatencyMs:s.p95TargetLatencyMs,meanCenterError:s.meanCenterError,p95CenterError:s.p95CenterError},null,2);}}
async function start(){const r=await fetch('/api/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({config:{viewportW:innerWidth,viewportH:innerHeight}})});state=await r.json();session=state.sessionId;resize();render(state);}canvas.addEventListener('pointerdown',async e=>{if(!e.isTrusted||busy||!state||state.finished)return;busy=true;const now=performance.now();try{const r=await fetch('/api/click',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:session,trusted:e.isTrusted,clientX:e.clientX,clientY:e.clientY,screenX:e.screenX,screenY:e.screenY,cueToClickLatencyMs:now-shownAt,lastMoveToClickDwellMs:lastMoveAt===null?null:now-lastMoveAt,movement})});render(await r.json());}finally{busy=false;}});start().catch(e=>{document.getElementById('request').textContent='ERROR';console.error(e)});
</script></body></html>
